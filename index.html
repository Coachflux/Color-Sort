<!doctype html>
<html lang="en">

<style>
:root{--gold:#ffd34f;--deep:#1a0b06;--wood:#4b2514;--wood2:#8c5129;--green:#35e56f;--blue:#2a8cff;--cream:#fff5d5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061525;color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button{font:inherit;border:0;color:inherit;cursor:pointer}#app{height:100%;display:grid;place-items:center}.screen{position:relative;width:min(100vw,480px);height:100dvh;min-height:600px;overflow:hidden;background:linear-gradient(180deg,#14679a 0%,#123c5d 44%,#091b2c 100%);box-shadow:0 0 55px #0009}.screen:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 4%,#b8f4ff55,transparent 19%),radial-gradient(circle at 95% 20%,#ffd84c2b,transparent 25%),linear-gradient(110deg,transparent 45%,#fff1 46%,transparent 47%)}
/* scenic layer */.mountain{position:absolute;left:-10%;right:-10%;bottom:17%;height:38%;background:linear-gradient(135deg,#244f68,#0d314b);clip-path:polygon(0 85%,12% 54%,22% 76%,36% 36%,49% 68%,64% 24%,77% 58%,91% 30%,100% 72%,100% 100%,0 100%);opacity:.7}.water{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#0d5275,#061d32);opacity:.9}.water:after{content:"";position:absolute;inset:15% 0 0;background:repeating-linear-gradient(175deg,transparent 0 13px,#5bd6ff20 14px 16px)}.lantern{position:absolute;width:22px;height:34px;border:2px solid #d99c48;border-radius:7px;background:#ffcf5133;box-shadow:0 0 20px #ffd35a99}.lantern:after{content:"";position:absolute;left:7px;top:6px;width:5px;height:17px;background:#fff0a0;border-radius:5px;box-shadow:0 0 12px 5px #ffd34e}.l1{left:7%;bottom:26%}.l2{right:8%;bottom:39%}.leaf{position:absolute;width:42px;height:22px;border-radius:100% 0 100% 0;background:#2fa65a;transform:rotate(-28deg);opacity:.75}.leaf.a{left:-8px;top:13%}.leaf.b{right:-8px;top:19%;transform:rotate(35deg)}
/* common */.topbar{position:relative;z-index:4;height:72px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between}.pill{border:2px solid #a56635;border-radius:19px;background:linear-gradient(#70401f,#2c1409);box-shadow:inset 0 2px #fff2,0 5px 12px #0007;padding:7px 14px;font-weight:950}.level{min-width:128px;text-align:center;font-size:19px}.coin{display:flex;gap:6px;align-items:center}.coin i{font-style:normal;display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff9ad,#ffc31c 58%,#9b5d00);border:2px solid #ffe983;color:#895100}.plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#31d869}.woodpanel{position:relative;z-index:2;margin:0 10px;border:3px solid #9b6031;border-radius:25px;background:linear-gradient(120deg,#281309ee,#754321ea 48%,#281208ee);box-shadow:inset 0 0 0 2px #180a05,0 14px 30px #0009}.progress{height:15px;margin:0 45px 10px;border-radius:9px;border:2px solid #75481f;background:#241309;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(#fff27b,#ffb200);border-radius:8px;box-shadow:0 0 12px #ffd72f;transition:width .5s}
/* home */.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:3;text-align:center;padding:25px}.logo{font-weight:1000;font-size:55px;line-height:.82;letter-spacing:-4px;text-shadow:3px 5px 0 #43160c,0 0 20px #7deaff}.logo b{display:inline-block}.c{color:#ff3d63}.o{color:#ffc52e}.l{color:#42e86c}.o2{color:#3ca8ff}.r{color:#ff5bad}.logo em{display:block;font-style:normal;color:#fff;font-size:57px;margin-top:14px;letter-spacing:-3px}.tag{margin:20px 0 28px;font-weight:900;letter-spacing:2px}.play,.next{min-width:235px;padding:15px 30px;border-radius:38px;background:linear-gradient(#6bfa8e,#19c956);border:3px solid #adffc0;box-shadow:0 6px 0 #0a8b37,0 10px 20px #0007;font-size:24px;font-weight:1000}.sub{margin-top:27px;font-size:12px;opacity:.82}
/* map */.map{position:absolute;inset:0;z-index:3;padding:12px 20px}.maptitle{text-align:center;margin:6px 0 12px;font-size:25px;font-weight:1000}.path{position:relative;height:calc(100% - 72px);margin:0 auto;width:92%;overflow:auto;padding:10px 0 35px;scrollbar-width:none}.path::-webkit-scrollbar{display:none}.node{position:absolute;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#fff37c,#ffc21f 55%,#a75c00);border:5px solid #fff1a2;box-shadow:0 7px 0 #875000,0 0 20px #ffd02e99;font-weight:1000;font-size:22px;color:#613400}.node.lock{filter:grayscale(.8);opacity:.6}.node:nth-child(1){left:8%;bottom:4%}.node:nth-child(2){right:10%;bottom:18%}.node:nth-child(3){left:17%;bottom:33%}.node:nth-child(4){right:4%;bottom:48%}.node:nth-child(5){left:35%;bottom:63%}.node:nth-child(6){right:23%;bottom:78%}.node:nth-child(n+7){position:relative;left:auto;right:auto;bottom:auto;margin:18px auto}.node:nth-child(odd){transform:translateX(-24%)}.node:nth-child(even){transform:translateX(24%)}.node:after{content:"";position:absolute;inset:-12px;border:2px dashed #ffe68055;border-radius:50%;animation:spin 9s linear infinite}.route{position:absolute;left:8%;right:8%;bottom:13%;height:65%;border-left:7px dotted #ffda55aa;transform:rotate(7deg);filter:drop-shadow(0 0 5px #ffcb35)}@keyframes spin{to{transform:rotate(360deg)}}
/* game */.game{position:absolute;inset:0;z-index:3}.board{margin:0 10px;height:calc(100% - 235px);min-height:390px;padding:25px 10px 18px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:22px 13px;position:relative}.board:before{content:"";position:absolute;inset:5px;border-radius:20px;border:1px solid #ffc77822}.tube{position:relative;width:57px;height:168px;border-radius:18px 18px 25px 25px;border:3px solid #dff9ffbb;background:linear-gradient(90deg,#ffffff2c,#ffffff09 25%,#ffffff20 55%,#0002);box-shadow:inset 7px 0 11px #fff2,inset -6px 0 10px #0004,0 6px 10px #000a;overflow:hidden;transition:transform .18s,filter .18s}.tube:before{content:"";position:absolute;z-index:8;top:-7px;left:7px;right:7px;height:14px;border-radius:50%;border:3px solid #efffffcc;background:#ffffff12}.tube.selected{transform:translateY(-14px) scale(1.05);filter:drop-shadow(0 0 12px #fff)}.tube.pulse{animation:pulse .35s ease}.tube.shake{animation:shake .3s ease}@keyframes pulse{50%{transform:translateY(-8px) scale(1.08)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.liquid{position:absolute;left:3px;right:3px;height:25%;border-radius:0;box-shadow:inset 0 3px 4px #fff5,inset 0 -4px 6px #0003;transition:bottom .28s,height .28s}.liquid:first-of-type{border-radius:0 0 18px 18px}.liquid.red{background:linear-gradient(#ff7660,#e91531)}.liquid.yellow{background:linear-gradient(#fff073,#ffb900)}.liquid.blue{background:linear-gradient(#61e2ff,#0877f1)}.liquid.green{background:linear-gradient(#83f06e,#13a63d)}.liquid.purple{background:linear-gradient(#ea75ff,#8a18e2)}.liquid.cyan{background:linear-gradient(#75f9e8,#0bb9b6)}.liquid.pink{background:linear-gradient(#ff83d1,#ed128b)}.actions{height:125px;display:flex;align-items:center;justify-content:center;gap:20px;position:relative;z-index:4}.action{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#a45f32,#3a1a0d 70%);border:3px solid #d99c51;box-shadow:inset 0 3px #fff2,0 7px 12px #0009;font-size:27px;position:relative}.action small{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}.badge{position:absolute;right:-4px;top:-4px;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#26d66b;border:2px solid white;font-size:11px}
.ico{position:absolute;inset:0;margin:auto;width:30px;height:30px;display:block}.undoIcon{border:4px solid #f6d28d;border-right-color:transparent;border-radius:50%}.undoIcon:before{content:"";position:absolute;left:-5px;top:-5px;border-top:8px solid #f6d28d;border-left:8px solid transparent;border-right:2px solid transparent;transform:rotate(-25deg)}.hintIcon{width:21px;height:25px;border-radius:50% 50% 42% 42%;background:linear-gradient(#fff5a1,#ffb61e);box-shadow:0 0 8px #ffd85a}.hintIcon:after{content:"";position:absolute;left:5px;right:5px;bottom:-5px;height:5px;border-radius:3px;background:#f5d37b}.shuffleIcon:before,.shuffleIcon:after{content:"";position:absolute;width:25px;height:11px;border-top:4px solid #f6d28d;border-right:4px solid #f6d28d;transform:rotate(22deg);top:3px;left:1px}.shuffleIcon:after{top:15px;transform:rotate(-22deg);border-top:0;border-bottom:4px solid #f6d28d;border-right:4px solid #f6d28d}.rewardCoin{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff7a0,#ffc21f 60%,#a85e00);border:2px solid #ffe98a;color:#8a4f00;box-shadow:0 2px 8px #0007}.lockIcon{width:20px;height:17px;border-radius:4px;background:#d8d8d8;display:inline-block;position:relative}.lockIcon:before{content:"";position:absolute;width:12px;height:11px;border:4px solid #d8d8d8;border-bottom:0;border-radius:8px 8px 0 0;left:0;top:-10px}.mapIcon{display:inline-block;width:20px;height:18px;border:2px solid #ffe39a;border-radius:3px;vertical-align:-3px;margin-right:6px;position:relative}.mapIcon:after{content:"";position:absolute;left:5px;top:2px;width:5px;height:10px;border-left:2px solid #ffe39a;border-right:2px solid #ffe39a}/* effects/modal */.toast{position:absolute;z-index:30;left:50%;top:17%;transform:translate(-50%,-20px);padding:9px 17px;border-radius:20px;background:#201006dd;border:2px solid #ffcf65;color:#fff3ad;font-weight:1000;opacity:0;pointer-events:none}.toast.show{animation:toast 1.2s ease}@keyframes toast{15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}.overlay{position:absolute;inset:0;background:#041321cc;backdrop-filter:blur(4px);display:none;place-items:center;z-index:50}.overlay.show{display:grid}.modal{width:86%;padding:25px 18px 30px;border-radius:28px;text-align:center;background:linear-gradient(#70401f,#2b1308);border:3px solid #d89a52;box-shadow:0 20px 55px #000d}.stars{font-size:46px;letter-spacing:4px;color:#ffd342;text-shadow:0 0 12px #ffc000}.modal h1{font-size:39px;margin:4px 0 8px}.reward{font-weight:1000;margin:9px 0 18px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:8px;height:16px;top:-20px;animation:fall 1.8s linear forwards}.confetti i:nth-child(1){left:12%;background:#ff476e;animation-delay:.05s}.confetti i:nth-child(2){left:25%;background:#4edbff;animation-delay:.25s}.confetti i:nth-child(3){left:39%;background:#ffd33f;animation-delay:.1s}.confetti i:nth-child(4){left:56%;background:#6ff070;animation-delay:.35s}.confetti i:nth-child(5){left:71%;background:#ff6bd1;animation-delay:.2s}.confetti i:nth-child(6){left:87%;background:#9e7bff;animation-delay:.4s}@keyframes fall{to{top:110%;transform:rotate(600deg)}}
@media(max-height:680px){.tube{height:145px}.board{gap:15px 11px}.logo{font-size:47px}.logo em{font-size:50px}.play{padding:12px 28px}}

.coinIcon svg,.rewardCoin svg{width:18px;height:18px;display:block}.coinIcon svg circle,.rewardCoin svg circle{fill:none;stroke:#8b5200;stroke-width:1.5}.coinIcon svg path,.rewardCoin svg path{fill:none;stroke:#8b5200;stroke-width:1.5;stroke-linecap:round}.stars svg{width:180px;height:48px;display:block;margin:auto}.playIcon{display:inline-block;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #fff;vertical-align:-2px;filter:drop-shadow(0 2px 1px #087d31)}.backIcon{display:inline-block;width:12px;height:12px;border-left:3px solid #ffe7b0;border-bottom:3px solid #ffe7b0;transform:rotate(45deg);margin-left:4px}.backBtn{min-width:48px;padding:9px 12px}.backHome{padding:8px 13px}.rewardCoin svg{width:19px;height:19px}.node{transition:transform .15s,filter .15s}.node:not(.lock):active{transform:scale(.94)}.mapHint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;opacity:.72}.</style></head><body><div id="app"></div>
<script>
const C=['r','y','b','g','p','c','m'];const N={r:'red',y:'yellow',b:'blue',g:'green',p:'purple',c:'cyan',m:'pink'};let level=1,coins=360,undo=3,hint=5,shuffle=4,selected=-1,stacks=[],history=[],screen='home',audio=true;
const $=s=>document.querySelector(s);function tone(freq=520,dur=.08,type='sine'){if(!audio)return;try{const A=window.AudioContext||window.webkitAudioContext,ctx=new A(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}
function save(){localStorage.colorSortSave=JSON.stringify({level,coins,undo,hint,shuffle})}function load(){try{Object.assign(window,JSON.parse(localStorage.colorSortSave||'{}'))}catch(e){}}load();
function difficulty(n){return Math.min(7,3+Math.floor((n-1)/4))}function newLevel(n=level){level=n;selected=-1;history=[];const cc=difficulty(n);stacks=[];for(let c=0;c<cc;c++)stacks.push(Array(4).fill(C[c]));stacks.push([]);stacks.push([]);let moves=80+n*10;while(moves--){const sources=stacks.map((s,i)=>s.length?i:-1).filter(i=>i>=0),a=sources[Math.floor(Math.random()*sources.length)];const possible=stacks.map((s,i)=>i).filter(b=>b!==a&&s.length<4&&(!s.length||s.at(-1)===stacks[a].at(-1)));if(!possible.length)continue;const b=possible[Math.floor(Math.random()*possible.length)];const col=stacks[a].at(-1);let count=1;while(count<stacks[a].length&&stacks[a][stacks[a].length-1-count]===col)count++;count=Math.min(count,4-stacks[b].length);for(let i=0;i<count;i++)stacks[b].push(stacks[a].pop())}if(solved())return newLevel(n);screen='game';render()}
function solved(){return stacks.length&&stacks.every(s=>!s.length||(s.length===4&&s.every(x=>x===s[0])))}
function canMove(a,b){const A=stacks[a],B=stacks[b];return a!==b&&A.length&&B.length<4&&(!B.length||B.at(-1)===A.at(-1))}
function move(a,b){if(!canMove(a,b)){tone(130,.06,'square');const t=document.querySelectorAll('.tube')[b];if(t){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}return}history.push(JSON.stringify(stacks));const A=stacks[a],B=stacks[b],col=A.at(-1);let count=1;for(let i=A.length-2;i>=0&&A[i]===col;i--)count++;count=Math.min(count,4-B.length);for(let i=0;i<count;i++)B.push(A.pop());selected=-1;tone(390,.06);setTimeout(()=>tone(620,.07),55);render();if(solved())setTimeout(win,.5*1000)}
function tap(i){if(selected<0){if(stacks[i].length){selected=i;tone(560,.05);render()}}else{const from=selected;selected=-1;move(from,i)}}
function undoMove(){if(!history.length||undo<=0){toast('No undo available');return}stacks=JSON.parse(history.pop());undo--;tone(300,.07);render();save()}
function hintMove(){if(hint<=0){toast('No hints left');return}for(let a=0;a<stacks.length;a++)for(let b=0;b<stacks.length;b++)if(canMove(a,b)){hint--;selected=a;render();setTimeout(()=>{const el=document.querySelectorAll('.tube')[a];if(el){el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),500)}},30);tone(760,.1);save();return}toast('Try separating the colors first')}
function shuffleStacks(){if(shuffle<=0){toast('No shuffles left');return}shuffle--;let all=stacks.flat();all.sort(()=>Math.random()-.5);let k=0;for(const s of stacks)for(let i=0;i<s.length;i++)s[i]=all[k++];tone(240,.08);render();save()}
function toast(msg){const t=$('.toast');if(!t)return;t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
function tubeHTML(s,i){let h='';for(let k=0;k<s.length;k++)h+=`<div class="liquid ${N[s[k]]}" style="bottom:${k*25}%"></div>`;return `<button aria-label="Bottle ${i+1}" class="tube ${i===selected?'selected':''}" onclick="tap(${i})">${h}</button>`}
function base(){return `<div class="mountain"></div><div class="water"></div><div class="lantern l1"></div><div class="lantern l2"></div><div class="leaf a"></div><div class="leaf b"></div>`}
function home(){screen='home';render()}function map(){screen='map';render()}
function gameUI(){return `<main class="screen game">${base()}<div class="topbar"><button class="pill backBtn" aria-label="Back to map" onclick="map()"><span class="backIcon"></span></button><div class="pill level">Level ${level}</div><div class="pill coin"><i class="coinIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M8.5 9.2c.7-1 1.7-1.4 3.1-1.4 1.7 0 3 1 3 2.3 0 3.5-6.2 1.3-6.2 4.3 0 1.3 1.2 2.3 3.2 2.3 1.5 0 2.6-.5 3.3-1.6"/></svg></i>${coins}<span class="plus">+</span></div></div><div class="progress"><span style="width:${Math.min(100,20+level*3)}%"></span></div><section class="woodpanel board">${stacks.map(tubeHTML).join('')}</section><div class="actions"><button class="action" aria-label="Undo" onclick="undoMove()"><span class="ico undoIcon" aria-hidden="true"></span><span class="badge">${undo}</span><small>Undo</small></button><button class="action" aria-label="Hint" onclick="hintMove()"><span class="ico hintIcon" aria-hidden="true"></span><span class="badge">${hint}</span><small>Hint</small></button><button class="action" aria-label="Shuffle" onclick="shuffleStacks()"><span class="ico shuffleIcon" aria-hidden="true"></span><span class="badge">${shuffle}</span><small>Shuffle</small></button></div><div class="toast"></div><div id="overlay" class="overlay"><div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="modal"><div class="stars" aria-label="Three stars"><svg viewBox="0 0 180 48"><g fill="currentColor"><path d="m25 2 7 14 16 2-12 11 3 16-14-8-14 8 3-16L2 18l16-2z"/><path d="m90 2 7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/><path d="m155 2 7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/></g></svg></div><h1>Amazing!</h1><div class="reward"><span class="rewardCoin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M8.5 9.2c.7-1 1.7-1.4 3.1-1.4 1.7 0 3 1 3 2.3 0 3.5-6.2 1.3-6.2 4.3 0 1.3 1.2 2.3 3.2 2.3 1.5 0 2.6-.5 3.3-1.6"/></svg></span> +50 Coins</div><button class="next" onclick="coins+=50;newLevel(level+1);save()">Next Level</button></div></div></main>`}
function win(){save();const o=$('#overlay');if(o)o.classList.add('show');tone(700,.1);setTimeout(()=>tone(900,.12),120);setTimeout(()=>tone(1100,.16),250)}
function render(){if(screen==='game'){app.innerHTML=gameUI();return}if(screen==='map'){app.innerHTML=`<main class="screen">${base()}<div class="map"><button class="pill backHome" aria-label="Back home" onclick="home()"><span class="backIcon"></span> Home</button><div class="maptitle">WORLD OF COLORS</div><div class="path"><div class="route"></div>${Array.from({length:20},(_,i)=>i+1).map(n=>`<button class="node ${n>level?'lock':''}" onclick="${n<=level?'newLevel('+n+')':'toast(\'Finish the previous levels first\')'}">${n>level?'<span class="lockIcon"></span>':n}</button>`).join('')}</div></div></main>`;return}app.innerHTML=`<main class="screen">${base()}<div class="home"><div class="logo"><b class="c">C</b><b class="o">O</b><b class="l">L</b><b class="o2">O</b><b class="r">R</b><em>SORT</em></div><div class="tag">SORT • MATCH • WIN</div><button class="play" onclick="newLevel(1)"><span class="playIcon" aria-hidden="true"></span> Play</button><button class="pill mapButton" style="margin-top:24px" onclick="map()"><span class="mapIcon"></span> Level Map</button><div class="sub">Beautiful bottles • Smart puzzles • Play offline</div></div></main>`}
render();
</script></body></html>
